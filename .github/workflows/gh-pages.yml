name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:

# Zwei Laeufe auf demselben Zweig duerfen sich nicht ueberholen.
#
# Am 2026-09-04 ist genau das passiert, und es hat die Live-Seite fuer 27 Minuten
# auf einen aelteren Stand zurueckgesetzt:
#
#   2a557e7 (dependabot)  gestartet 09:25:16  FERTIG 09:32:45
#   0f1add6 (PR #75)      gestartet 09:25:38  FERTIG 09:32:16
#
# Der aeltere Commit war 29 Sekunden spaeter fertig und hat die neuere
# Veroeffentlichung ueberschrieben. peaceiris/actions-gh-pages schreibt den
# Zweig gh-pages neu, ohne zu pruefen, was dort steht, es gewinnt also schlicht
# der Lauf, der zuletzt endet, nicht der neueste Commit.
#
# Die Gruppe haengt am ref, nicht am Workflow allein: zwei Pushes auf main
# teilen sich eine Gruppe und der neuere bricht den laufenden aelteren ab,
# waehrend jeder Pull Request seine eigene Gruppe behaelt und niemandem
# dazwischenfaehrt.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Before the PDFs, not after: both PDFs are rendered from the same
      # config.cv.toml this checks, so a bad config should fail in a second
      # rather than after two Puppeteer runs. The build below runs it again
      # (npm run build), which is what keeps it un-bypassable.
      - name: Check content guards
        run: npm run check:i18n

      - name: Generate PDFs
        run: |
          ./scripts/generate_cv.sh config.cv.toml public/pdfs/Michael_Boiman_CV_DE.pdf de
          ./scripts/generate_cv.sh config.cv.toml public/pdfs/Michael_Boiman_CV_EN.pdf en

      # Before the build, because the page states the result and can only state
      # what already exists on disk. It never fails: a third party being down
      # for a minute is not a reason to refuse a deploy, and the sentence on the
      # page reports whatever was actually measured. Without this step the file
      # is missing and the page simply says nothing about it.
      - name: Check the addresses the CV links to
        run: npm run check:links
        continue-on-error: true

      - name: Build Astro
        # npm run build, NOT npx astro build. The i18n/content guard
        # (scripts/check-i18n.mjs) hangs off the npm script; calling astro
        # directly skipped it on every deployment this repo ever made, while
        # the comments in src/lib/i18n.ts claimed it ran "at build time".
        run: npm run build

      # Cached HTML must keep finding its stylesheet and its script.
      #
      # Pages answers HTML with `cache-control: max-age=600` while Astro renames
      # an asset whenever its content changes, so for ten minutes after a deploy
      # the edge hands out markup that names files this deploy just removed.
      # Measured on 2026-09-04 against the previous published build: the CVPage
      # stylesheet and the agent widget's script both answered 404, so a visitor
      # in that window saw the page unstyled and the chat dead.
      #
      # Runs on EVERY build, not only on main. Gating it on main would mean the
      # step first executes in the run where it matters, with nothing having
      # exercised it: the first CI run of this workflow was green while the step
      # was skipped entirely. On a pull request it only adds files to dist/,
      # which nothing on a pull request publishes, and in exchange every PR
      # proves the fetch and the script still work in this environment.
      #
      # After the build on purpose, so the build's own guard still measures a
      # clean tree. Details and the one-generation rule: scripts/carry-assets.mjs
      - name: Carry the previous build's code assets forward
        run: |
          git fetch --depth=1 origin gh-pages || echo "no gh-pages yet, nothing to carry"
          node scripts/carry-assets.mjs

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
