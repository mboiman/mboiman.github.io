<!DOCTYPE html>
<html lang="{{LANGUAGE}}">
<head>
    <meta charset="utf-8">
    <title>{{NAME}}, {{DOC_TITLE}} {{COMPANY}}</title>
    <style>
        /* Fonts, tokens and the header come from scripts/lib/pdf-theme.js, the
           same module the CV uses, so letter and CV print as one document. */
        {{THEME_CSS}}

        body { font-size: 10pt; line-height: 1.55; }

        .letter-top {
            display: grid;
            grid-template-columns: 1fr auto;
            column-gap: 10mm;
            align-items: end;
            margin: 12mm 0 10mm 0;
        }

        .recipient { font-size: 10pt; line-height: 1.45; color: var(--ink); }
        .letter-date { font-size: 10pt; color: var(--text); white-space: nowrap; }

        .subject {
            font-size: 10.5pt;
            font-weight: 600;
            color: var(--ink);
            line-height: 1.4;
            margin-bottom: 7mm;
        }

        .body p { margin-bottom: 3.5mm; }
        .body p:last-child { margin-bottom: 0; }
        .greeting { margin-bottom: 3.5mm; }

        .note {
            font-size: 8pt;
            color: var(--muted);
            font-style: italic;
        }

        .sign-off { margin-top: 7mm; break-inside: avoid; page-break-inside: avoid; }

        .enclosure {
            margin-top: 10mm;
            font-size: 9pt;
            color: var(--muted);
        }

        /* Requirement match: an enclosure on its own page, set as a table. */
        .mapping { break-before: page; page-break-before: always; }
        .req {
            display: grid;
            grid-template-columns: 52mm 1fr;
            column-gap: 6mm;
            padding: 3mm 0;
            border-bottom: 0.5pt solid var(--rule-soft);
            break-inside: avoid;
            page-break-inside: avoid;
            font-size: 9pt;
            line-height: 1.5;
        }
        .req:last-child { border-bottom: none; }
        .req-label { font-weight: 600; color: var(--ink); }
        .req-ref { font-size: 8pt; color: var(--muted); margin-top: 1mm; }
    </style>
</head>
<body>
    {{HEADER}}

    {{AI_DISCLOSURE_TOP}}

    <div class="letter-top">
        <div class="recipient">{{RECIPIENT}}</div>
        <div class="letter-date">{{DATE}}</div>
    </div>

    <div class="subject">{{SUBJECT}}</div>

    <div class="body">
        <div class="greeting">{{GREETING}}</div>
        {{BODY}}
    </div>

    <div class="sign-off">
        {{SIGN_OFF}}
    </div>

    <div class="enclosure">{{ATTACHMENT_LABEL}}</div>

    {{REQUIREMENTS_SECTION}}
</body>
</html>
