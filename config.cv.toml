        [[languages.de.params.experiences.list]]
        position = "LLM Infrastructure Architect & Automation Engineer"
        anchor = "bks-llm-infra"
        dates = "seit 06/2025"
        company = "BKS · AI Research & Development"
        details = """
**Entwicklung eines LLM-orchestrierten Enterprise Development Ecosystems**: Vollständig integriertes System für Knowledge Management, Project Automation und Development Workflows mit Claude, Gemini und OpenAI GPT.

**Schwerpunkte**
- **Quelloffene Agenten-Infrastruktur**: open-bridge unter MIT-Lizenz, öffentlich auf github.com/bks-lab/open-bridge, mit Live-Demo-Seite. Die generische CORE-Schicht (Agenten-Laufzeit, MCP-Gateway, Skill-Baum, Promote-Flow mit Content-Leak-Gate in der CI) entsteht aus der eigenen Instanz und wird scope-getrieben nach oben veröffentlicht: 35 Skills, 23 Regeln, 796 automatisierte Testfälle in 51 Testdateien, 30 Releases seit Juni 2026. Angriffsfixtures für Pfad-Traversal, Secrets und fehlerhafte Overlays laufen als eigene CI-Stufe mit
- **Datentrennung als Architektur, nicht als Absprache**: Getrennte Instanzen je Mandant, eine Regel, die den Zugriff zwischen Instanzen verbietet, und ein fail-closed-Vertrag für das Materialisieren geteilter Konfiguration (der Abgleich bricht ab, statt im Zweifel zu schreiben). Schutz gegen Datenabfluss an drei Stellen: Pre-Commit-Hook, Pre-Push-Hook und drei Validatoren in der CI. Dazu eine adversariale Simulation, die den Schutz regelmäßig selbst angreift, als eigener CI-Job in einer abgeschotteten Sandbox
- **Agenten-Netz nach A2A**: a2a-sdk-Server mit lokalem claude-Backend auf einer aus open-bridge übernommenen Laufzeit. Drei Agenten (Person, Firma, OSS-Projekt) befragen sich gegenseitig ausschließlich lesend, davor ein zustandsloses MCP-nach-A2A-Gateway, damit auch reine MCP-Clients die Agenten erreichen. Agent Cards nach Protokollversion 1.0, JSON-RPC 2.0. Rund 4.600 Zeilen Python mit 98 automatisierten Testfällen, im Team entstanden (vier weitere Beitragende)
- **Telemetrie nach OpenTelemetry**: Logs, Metriken und Traces über OTLP an eine verwaltete Senke, mit fester Feldkonvention und Namensschema, gedeckeltem Ingest-Schlüssel und nach Mandant getrennten Leserechten (als Rechteschnitt gemessen, nicht als Absicht dokumentiert). Ehrlicher Reifegrad: der Logpfad ist im Betrieb, Metriken und Traces sind verdrahtet und noch nicht abgenommen
- **Menschliches Gate auf vier Autonomiestufen**: Was ein Agent an sich selbst ändern darf, ist in vier Schichten getrennt (Kontext, Skill-Dateien und Regeln, Nutzerprofil, Modellgewichte), jede mit ausdrücklichem menschlichem Gate. Vorschläge laufen über einen eigenen Ordner mit Schema und Prüfpfad, statt still wirksam zu werden. Die EU-KI-Verordnung ist damit nicht nur Workshop-Inhalt, sondern die eigene Betriebspraxis
- **Spezifikation und Verifikationsdesign**: Vor dem Bauen führt ein fester Ablauf durch Anforderung, Entwurf und Verifikationsplan. Jedes Abnahmekriterium bekommt dabei die stärkste verfügbare Prüfung, in dieser Reihenfolge: deterministischer Test vor externem Signal vor Modell-Urteil, dazu die Gate-Stärke. Das ist die Stelle, an der Quality Engineering und KI-Entwicklung dieselbe Disziplin sind
- **Git-Wiki Transformation**: Migration der Confluence-Wissensdatenbank zu strukturiertem Git-basiertem Wiki mit hierarchischer Organisation und Multi-Repository-Architektur (Submodules für Kundenprojekte)
- **MCP Navigation Server**: Entwicklung eines Model Context Protocol Servers (Python) mit intelligenter Hierarchie-Navigation, automatischer Content-Discovery und SharePoint-Integration
- **Google ADK (frühere Stufe)**: Die erste Fassung des Agenten-Netzes lief auf dem Google Agent Development Kit mit LiteLLM. Im Juli 2026 durch den a2a-sdk-Server auf eigener Laufzeit ersetzt, die Erfahrung mit ADK und dessen Tool-Integration bleibt
- **GitHub Project Automation**: LLM-gesteuertes Issue-Management mit 7-Pflichtfelder-System, automatischer Kategorisierung, Smart Repository Mapping und Review Queue Management
- **Development Workflow Automation**: GitHub Actions Workflows für vollautomatische Issue-to-PR-Transformation (Assignment → Feature-Branch → Implementation → Code Review → PR)
- **Selbst-dokumentierendes System**: LLM schreibt automatisch Projektstatus, Meeting-Protokolle und Issue-Updates zurück ins Git-Wiki; geschlossener Loop von Wiki-Lesen → Arbeit ausführen → Ergebnisse dokumentieren → Git-Commit mit strukturierter Protokollierung
- **Arbeitszeit-Erfassung**: Commit-basierte Arbeitszeitanalyse mit automatischer Projekt-Zuordnung. Erste Stufe lief gegen Clockify; seit Juli 2026 im Aufbau als eigene Registry semantischer Konventionen auf Basis von OpenTelemetry Weaver, mit drei Schichten (Rohbeobachtung, abgeleiteter Block, abrechenbare Zeit), kanonischer JSON-Serialisierung nach RFC 8785 und einem Integritätsprofil nach OCSF
- **Claude Code Plugin-Ecosystem**: 102 Skills in der produktiven Instanz, über eingecheckte Symlinks von Claude Code, Codex, Copilot CLI und Cursor gleichermaßen gefunden: Log-Analyse, Deployment-Verifikation, Incident-Handling, E-Mail-Management, Meeting-Transkription (87 abgelegte Besprechungen), PDF/Zertifikat-Generierung, SharePoint-Integration. Jeder Skill trägt eine von vier Scope-Stufen (core, org, personal, user), die ein CI-Validator prüft; daran hängt, was überhaupt nach außen veröffentlicht werden darf
- **Context Orchestrator**: Zentrales Multi-Repo-Steuerungssystem mit dreigeteilter Registry (Instanz-Basis, geteiltes Org-Fragment, persönliches Fragment), damit Firmendaten und Personendaten getrennt verteilt werden können. Trägt Repos, Kunden, Infrastruktur und Skills, dazu automatische Cross-Repo-Navigation und strukturiertes Arbeits-Tracking mit Archivierung
- **Hook-basiertes Permission System**: Smart Guard mit projektspezifischen Sicherheitsregeln für Git-Operationen: Branch-Schutz, Secret-Erkennung und Deployment-Gates
- **Production Operations E-Invoicing**: Laufende Betreuung einer E-Invoicing-Plattform einer führenden Online-Jobplattform (unter NDA): automatisiertes Incident-Management, Log-Analyse, Weekly Reporting und Go-Live Tracking
- **Eigenbetriebene Infrastruktur**: 50 launchd-Dienste auf dem zentralen Host, 17 Geräte in der Registratur, über Tailscale statt über offene Ports erreichbar. Sicherung nach 3-2-1 als deklarierte Topologie: 10 Quellen, 5 Ziele, 16 Strecken (restic/rclone auf NAS), deren Ist-Stand gegen das Soll abgeglichen wird.

**Tools & Technologien**
- LLM Orchestration: Claude (primär), Google Gemini, OpenAI GPT, Model Context Protocol (MCP), Google Agent Development Kit (ADK)
- AI Development Platform: Claude Code, Plugin-Architektur (Skills, Hooks, Commands, Agents), YAML/Markdown Configuration
- Multi-Agent: A2A Protocol 1.0, a2a-sdk, Agent Cards, MCP-nach-A2A-Gateway, JSON-RPC 2.0, SSE Streaming
- Backend: Python 3.13, FastAPI, uvx Distribution, Git Submodules
- Automation: GitHub Actions, GitHub GraphQL API, gh CLI
- Integration: SharePoint API, Microsoft Graph, Exchange Online, Elasticsearch, Kibana, OpenTelemetry/OTLP
- Betrieb: Cloudflare (Workers, Pages, R2, DNS), Tailscale, launchd, restic/rclone
- Development: Bash Scripting, jq, Docker, Multi-Agent Systems; orchestrierte Repos in Python, TypeScript, Rust und Go
        """

